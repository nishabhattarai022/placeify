name: placeify_flutter
description: AR-powered furniture visualizer and marketplace.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.8.0'
  flutter: '^3.32.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5

  # Serverpod backend
  placeify_client:
    path: ../placeify_client
  serverpod_auth_idp_flutter: 3.4.8
  serverpod_flutter: 3.4.8

  # UI (Nishabhattarai branch)
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.3.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_hooks: ^0.21.0
  hooks_riverpod: ^3.0.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.11.0
  video_player: ^2.11.1
  shared_preferences: ^2.5.3
  google_fonts: ^8.1.0
  image_picker: ^1.1.2
  file_picker: ^10.1.2
  permission_handler: ^12.0.1
  model_viewer_plus: ^1.10.0
  ar_flutter_plugin_plus: ^1.1.3
  vector_math: ^2.2.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces/Fraunces-VariableFont_SOFT,WONK,opsz,wght.ttf

  assets:
    - assets/config.json
    - assets/icons/
    - assets/images/
    - assets/images/home/
    - assets/images/splash/
    - assets/images/categories/
    - assets/images/ar/
    - assets/images/special_offers/
    - assets/lottie/
    - assets/video/

dependency_overrides:
  flutter_secure_storage: ^10.0.0

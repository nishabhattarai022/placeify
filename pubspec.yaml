name: placeify
description: AR-powered furniture visualizer and marketplace.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  go_router: ^17.3.0

  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  flutter_hooks: ^0.21.0
  hooks_riverpod: ^3.0.0

  freezed_annotation: ^3.0.0
  json_annotation: ^4.11.0
  video_player: ^2.11.1
  shared_preferences: ^2.5.3
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.0.0
  riverpod_generator: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces/Fraunces-VariableFont_SOFT,WONK,opsz,wght.ttf

  assets:
    - assets/icons/
    - assets/images/
    - assets/images/home/
    - assets/images/splash/
    - assets/images/categories/
    - assets/images/ar/
    - assets/images/special_offers/
    - assets/lottie/
    - assets/video/

# Production configuration for Placeify.
#
# Override at runtime with environment variables (recommended on hosting platforms):
#   SERVERPOD_DATABASE_HOST, SERVERPOD_DATABASE_PORT, SERVERPOD_DATABASE_NAME
#   SERVERPOD_DATABASE_USER, SERVERPOD_PASSWORD_database
#   SERVERPOD_API_SERVER_PUBLIC_HOST, SERVERPOD_API_SERVER_PUBLIC_SCHEME
#   SERVERPOD_PASSWORD_serviceSecret, SERVERPOD_PASSWORD_emailSecretHashPepper
#   SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper, SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey
#   SERVERPOD_PASSWORD_resendApiKey, SERVERPOD_PASSWORD_emailFrom
#   SERVERPOD_PASSWORD_emailProvider (set to "resend")
#
# See PRODUCTION_AUTH.md for the full list.

apiServer:
  port: 8080
  publicHost: api.placeify.app
  publicPort: 443
  publicScheme: https

insightsServer:
  port: 8081
  publicHost: insights.placeify.app
  publicPort: 443
  publicScheme: https

webServer:
  port: 8082
  publicHost: app.placeify.app
  publicPort: 443
  publicScheme: https

# Managed PostgreSQL (Neon, Supabase, RDS, etc.) — override host via SERVERPOD_DATABASE_HOST
database:
  host: localhost
  port: 5432
  name: placeify
  user: postgres
  requireSsl: true

redis:
  enabled: false
  host: localhost
  port: 6379

maxRequestSize: 524288

sessionLogs:
  consoleEnabled: false

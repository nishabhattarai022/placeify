# Staging configuration — mirrors production with separate hosts.
# Use the same SERVERPOD_* environment variables as production.
# Set SERVERPOD_PASSWORD_emailProvider=resend and configure Resend keys.

apiServer:
  port: 8080
  publicHost: api-staging.placeify.app
  publicPort: 443
  publicScheme: https

insightsServer:
  port: 8081
  publicHost: insights-staging.placeify.app
  publicPort: 443
  publicScheme: https

webServer:
  port: 8082
  publicHost: app-staging.placeify.app
  publicPort: 443
  publicScheme: https

database:
  host: localhost
  port: 5432
  name: placeify_staging
  user: postgres
  requireSsl: true

redis:
  enabled: false
  host: localhost
  port: 6379

maxRequestSize: 524288

sessionLogs:
  consoleEnabled: true
  consoleLogFormat: text

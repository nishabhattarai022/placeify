name: placeify_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

resolution: workspace

dependencies:
  crypto: ^3.0.6
  http: ^1.2.2
  image: ^4.5.4
  mailer: ^6.5.0
  serverpod: 3.4.8
  serverpod_auth_core_server: 3.4.8
  serverpod_auth_idp_server: 3.4.8
  yaml: ^3.1.3

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.8
  test: ^1.25.5

serverpod:
  scripts:
    # Repairs DB migration version drift after git restore / branch switches
    fix_migrations: dart bin/fix_migration_drift.dart

    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\placeify_flutter
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web ..\placeify_server\web\app
      posix: |
        cd ../placeify_flutter
        flutter build web --base-href /app/ --wasm --output ../placeify_server/web/app

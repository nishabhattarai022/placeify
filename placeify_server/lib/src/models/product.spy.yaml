### Furniture product listed by a vendor in the marketplace.
class: Product
table: product
fields:
  vendor: Vendor?, relation(onDelete=Cascade)
  category: Category?, relation(optional)
  name: String
  description: String
  price: double
  materials: String?
  widthCm: double?
  depthCm: double?
  heightCm: double?
  weightKg: double?
  assemblyNote: String?
  careInstructions: String?
  warranty: String?
  model3dUrl: String?
  thumbnailUrl: String?
  ### Extra catalog photos for Tripo multiview 3D: [left, back, right].
  viewImageUrls: List<String>?
  status: ProductStatus, default=active
  createdAt: DateTime, default=now

indexes:
  product_vendor_id:
    fields: vendorId

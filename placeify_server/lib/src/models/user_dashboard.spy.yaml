### Aggregated profile dashboard data for the logged-in customer.
class: UserDashboard
fields:
  profile: User
  orderCount: int
  wishlistCount: int
  cartItemCount: int
  arSessionCount: int
  refundCount: int
  ### Live marketplace catalog slices visible to every consumer.
  marketplace: MarketplaceHighlights
  ### Payment ledger aggregates (PostgreSQL).
  totalSpend: double, default=0
  refundAmount: double, default=0
  pendingRefundCount: int, default=0
  codOrderCount: int, default=0
  onlinePaymentCount: int, default=0

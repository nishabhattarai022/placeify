### Product complaint/damage report. Admins resolve these and may remove flagged products.
class: Complaint
table: complaint
fields:
  id: UuidValue?, defaultPersist=random_v7
  product: Product?, relation(onDelete=Cascade)
  reportedBy: User?, relation(onDelete=Cascade)
  reason: String
  description: String?
  status: ComplaintStatus, default=pending
  ### Admin assigned to review this complaint.
  assignedTo: Admin?, relation(optional)
  ### Internal admin-only notes (not visible to reporters).
  internalNote: String?
  ### Admin who marked this complaint resolved or rejected.
  resolvedBy: Admin?, relation(optional)
  resolvedAt: DateTime?
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now

indexes:
  complaint_product_id:
    fields: productId
  complaint_reported_by_id:
    fields: reportedById
  complaint_status:
    fields: status

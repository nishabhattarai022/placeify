### Aggregated vendor dashboard data for the logged-in seller.
class: VendorDashboard
fields:
  shop: Vendor
  productCount: int
  activeProductCount: int
  orderCount: int
  revenue: double
  pendingRefundCount: int, default=0
  recentOrders: List<VendorOrderSummary>
  topProducts: List<VendorProductStat>

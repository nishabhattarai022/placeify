### Metadata for creating a vendor product with an uploaded photo.
class: VendorProductUploadInput
fields:
  productId: int?
  name: String
  description: String
  price: double
  discountPrice: double?
  discountPercentage: double?
  featured: bool, default=false
  materials: String
  widthCm: double
  depthCm: double
  heightCm: double
  careInstructions: String
  categoryId: int?
  weightKg: double?
  assemblyNote: String?
  warranty: String?
  generateModel3d: bool, default=false
  isActive: bool, default=true
  viewImageUrls: List<String>?

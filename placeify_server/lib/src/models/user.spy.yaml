### Application user account.
class: User
table: user
fields:
  id: UuidValue?, defaultPersist=random_v7
  authUser: module:auth:AuthUser?, relation(onDelete=Cascade)
  name: String
  phone: String?
  address: String?
  createdAt: DateTime, default=now

indexes:
  user_auth_user_id:
    fields: authUserId
    unique: true

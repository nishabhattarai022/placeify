### Password reset token for custom link-based reset flow.
class: PasswordResetToken
table: password_reset_tokens
fields:
  id: UuidValue?, defaultPersist=random_v7
  user: User?, relation(onDelete=Cascade)
  tokenHash: String
  expiresAt: DateTime
  used: bool, default=false
  createdAt: DateTime, default=now

indexes:
  password_reset_tokens_user_id:
    fields: userId
  password_reset_tokens_token_hash:
    fields: tokenHash
    unique: true
  password_reset_tokens_expires_at:
    fields: expiresAt
  password_reset_tokens_used:
    fields: used

### Payment status update for a vendor order audit trail / payment ledger row.
class: PaymentUpdateSummary
fields:
  id: int
  orderId: int
  amount: double
  status: PaymentTransactionStatus
  note: String
  updatedAt: DateTime
  ### Optional listing fields (vendor payment history).
  paymentMethod: PaymentMethod?
  customerName: String?
  customerEmail: String?
  orderNumber: String?
  orderStatus: String?
  transactionId: String?
  providerTransactionId: String?
  deliveryFee: double?
  discount: double?
  vendorEarnings: double?
  refundStatus: String?
  refundDate: DateTime?
  createdAt: DateTime?

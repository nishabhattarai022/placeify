### AR visualization session for a product.
class: ARSession
table: ar_session
fields:
  user: User?, relation(onDelete=Cascade)
  product: Product?, relation(onDelete=Cascade)
  startedAt: DateTime, default=now
  deviceInfo: String?
  snapshotUrl: String?

indexes:
  ar_session_user_id:
    fields: userId
  ar_session_product_id:
    fields: productId

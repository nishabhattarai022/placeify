### Aggregated vendor payment balances for the payments dashboard.
class: VendorPaymentsOverview
fields:
  payouts: List<VendorPayoutSummary>
  pendingBalance: double
  totalEarned: double
  ### Count of OrderVendorPayment rows still pending for this vendor.
  pendingPaymentCount: int
  ### Customer payments (COD + eSewa) for this vendor shop.
  paymentHistory: List<PaymentUpdateSummary>
  ### Analytics (PostgreSQL aggregates).
  todayRevenue: double, default=0
  monthlyRevenue: double, default=0
  refundAmount: double, default=0
  refundCount: int, default=0
  successfulPaymentCount: int, default=0
  codPaymentCount: int, default=0
  esewaPaymentCount: int, default=0
  averageOrderValue: double, default=0
  pendingRefundCount: int, default=0

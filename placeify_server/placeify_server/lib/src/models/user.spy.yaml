### Core Placeify account (customer / vendor / admin).
### Email and password are managed by Serverpod Auth via authUser — not stored here.
### Role `consumer` is the customer role used across the app.
class: User
table: user
fields:
  id: UuidValue?, defaultPersist=random_v7
  authUser: module:auth:AuthUser?, relation(onDelete=Cascade)
  name: String
  email: String?
  phone: String?
  address: String?
  profileImageUrl: String?
  role: UserRole, default=consumer
  ### Default approved at signup; vendors set to pending in vendor_repository.createShop.
  status: UserAccountStatus, default=approved
  ### Admin who approved this account (vendor onboarding or customer verification).
  approvedBy: Admin?, relation(optional)
  ### Admin who last changed status (suspend, reject, re-approve).
  statusChangedBy: Admin?, relation(optional)
  isActive: bool, default=true
  deletedAt: DateTime?
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now

indexes:
  user_auth_user_id:
    fields: authUserId
    unique: true
  user_email:
    fields: email
    unique: true
  user_role:
    fields: role
  user_status:
    fields: status
